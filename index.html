<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WebGIS interaktif untuk mahasiswa perantau di Yogyakarta. Temukan kampus, kos, restoran, klinik, ATM, dan halte bus terdekat.">
    <title>JogjaMap — Panduan Mahasiswa Perantau Yogyakarta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                </div>
                <div>
                    <h1 class="logo-title">JogjaMap</h1>
                    <p class="logo-subtitle">Panduan Mahasiswa Perantau</p>
                </div>
            </div>
            <button id="sidebar-toggle-close" class="sidebar-close" aria-label="Close sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Search -->
        <div class="search-container">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="search-input" class="search-input" placeholder="Cari nama tempat..." autocomplete="off">
            <div id="search-results" class="search-results hidden"></div>
        </div>

        <!-- Category Accordion Filters -->
        <div class="category-section">
            <h2 class="section-title">Filter Kategori</h2>
            <div class="accordion-container" id="accordion-container">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-section">
            <h2 class="section-title">Statistik</h2>
            <div class="stats-grid" id="stats-grid"></div>
        </div>

        <div class="sidebar-footer">
            <p>Data: <a href="https://www.openstreetmap.org/" target="_blank" rel="noopener">OpenStreetMap</a> via HOTOSM</p>
            <p>Boundary: GADM v4.1 • Hanya wilayah DIY</p>
            <p>Jihan Nabilah Rahman</p>
        </div>
    </aside>

    <!-- Mobile Toggle -->
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>

    <!-- Map -->
    <div id="map"></div>

    <!-- Info Card -->
    <div id="info-card" class="info-card hidden">
        <button id="info-card-close" class="info-card-close" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="info-card-badge" id="info-card-badge">
            <span id="info-card-icon"></span>
        </div>
        <h3 id="info-card-name" class="info-card-name"></h3>
        <span id="info-card-type" class="info-card-type"></span>
        <div class="info-card-details">
            <div class="info-detail-row" id="info-detail-category">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                <span id="info-category-text"></span>
            </div>
            <div class="info-detail-row" id="info-detail-subcategory">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span id="info-subcategory-text"></span>
            </div>
            <div class="info-detail-row" id="info-detail-distance">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span id="info-distance-text"></span>
            </div>
            <div class="info-detail-row" id="info-detail-hours">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span id="info-hours-text"></span>
            </div>
            <div class="info-detail-row" id="info-detail-operator">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span id="info-operator-text"></span>
            </div>
        </div>
        <div class="info-card-actions">
            <button id="info-btn-fly" class="info-btn info-btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                Arahkan
            </button>
            <button id="info-btn-gmaps" class="info-btn info-btn-secondary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                Google Maps
            </button>
        </div>
    </div>

    <!-- Coordinate -->
    <div id="coord-display" class="coord-display">
        <span id="coord-text">-7.7956°S, 110.3695°E</span>
    </div>

    <!-- Loading -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <p class="loading-text">Memuat data peta...</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="app.js"></script>
</body>
</html>
